name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=bdostumski&show_icons=true&theme=ayu-mirage&border_color=aaaaaa&border_radius=15&custom_title=GitHub%20Stats
          path: profile/stats.svg
          token: ${{ secrets.READMETOKEN }}
          
      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=bdostumski&hide_progress=true&layout=compact&theme=ayu-mirage&border_color=aaaaaa&border_radius=15&hide=html,css,scss,batchfile&exclude_repo=bdostumski.github.io,learning-workflows
          path: profile/top-langs.svg
          token: ${{ secrets.READMETOKEN }}

      - name: Debug generated files
        run: |
          ls -la profile || true
          git status --porcelain

      - name: Commit cards
        run: |
          git config user.name "bdostumski"
          git config user.email "b.dostumski@gmail.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
